name: Release APK

# Manual equivalent of running scripts/release_apk.sh locally, for when the
# local environment lacks an Android SDK or an authenticated GitHub CLI.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK to build and publish"
        type: choice
        options: [dogfood, smoke]
        default: dogfood
      dry_run:
        description: "Only print the planned version bump"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TYPE: ${{ inputs.build_type }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: ./scripts/release_apk.sh | tee release.log

      - name: Job summary
        if: success() && !inputs.dry_run
        shell: bash
        run: |
          {
            echo '```'
            sed -n '/==> Release ready/,$p' release.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
